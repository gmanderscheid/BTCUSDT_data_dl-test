[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    structure: le fichier est lisible et a la forme attendue (non vide, colonnes, types, valeurs finies)
    chronologie: l'axe du temps est propre (doublons, tri, mois, alignement, durée des bougies)
    completude: contrat de couverture, trous courts / longs, échéancier du funding
    coherence: les prix sont plausibles et cohérents entre eux (OHLC, sauts, ordre de grandeur du funding)
    volumes: les volumes sont positifs et cohérents entre eux (acheteur, nuls, VWAP)
    registre: les registres d'exceptions sont bien formés, examinés et à jour
    verification: comparaison des bougies 1s reconstruites du perpétuel aux bougies 1 min officielles
    unit: tests unitaires du pipeline et des contrôles, sur données synthétiques (sans données réelles)
    klines: tests portant sur les bougies 1s (spot et perpétuel)
    spot: tests portant sur les bougies 1s du spot
    perp: tests portant sur le perpétuel (bougies 1s et référence 1 min)
    reference: tests portant sur les bougies 1 min officielles du perpétuel
    funding: tests portant sur le funding rate des futures perpétuels