[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    structure: le fichier est lisible et a la forme attendue (non vide, colonnes, types, NaN)
    chronologie: l'axe du temps est propre (doublons, tri, mois, alignement, close_time)
    completude: il ne manque ni secondes, ni mois, ni jours récents, ni paiements de funding
    coherence: les prix sont plausibles et cohérents entre eux (OHLC, VWAP, sauts, bornes du funding)
    volumes: les volumes et nombres de trades sont positifs et cohérents entre eux
    registre: le registre des trous longs (known_gaps.csv) est bien formé
    verification: comparaison des bougies 1s reconstruites du perpétuel aux bougies 1 min officielles
    klines: tests portant sur les bougies 1s (spot et perpétuel)
    spot: tests portant sur les bougies 1s du spot
    perp: tests portant sur les bougies 1s du perpétuel
    funding: tests portant sur le funding rate des futures perpétuels